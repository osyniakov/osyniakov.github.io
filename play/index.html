<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Play!">
<meta name="theme-color" content="#6ec6ff">
<title>Play!</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6ec6ff; overscroll-behavior: none; }
  * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #sat { position: fixed; top: 0; left: 0; width: 1px; height: env(safe-area-inset-top, 0px); visibility: hidden; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sat"></div>
<script>
'use strict';

/* ---------- setup ---------- */
const cv = document.getElementById('c');
const g = cv.getContext('2d');
let W = 0, H = 0, S = 0, DPR = 1, SAFE_TOP = 0, T = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight; S = Math.min(W, H);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  SAFE_TOP = document.getElementById('sat').offsetHeight || 0;
  if (scene && scene.resize) scene.resize();
}

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const EF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

/* ---------- language (en / uk / de, override with ?lang=xx) ---------- */
const LANGS = {
  en: {
    code: 'en-US',
    nums: ['One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'],
    colors: ['Red', 'Orange', 'Yellow', 'Green', 'Blue', 'Purple', 'Pink'],
    yay: 'Hooray! You did it!',
    animals: { dog: 'Doggy! Woof woof!', cat: 'Kitty! Meow!', frog: 'Froggy! Ribbit!', cow: 'Cow! Moo!',
               pig: 'Piggy! Oink oink!', lion: 'Lion! Roar!', monkey: 'Monkey! Ooh ooh ah ah!', duck: 'Duck! Quack quack!' }
  },
  uk: {
    code: 'uk-UA',
    nums: ['Один', 'Два', 'Три', 'Чотири', "П'ять", 'Шість', 'Сім', 'Вісім', "Дев'ять", 'Десять'],
    colors: ['Червоний', 'Помаранчевий', 'Жовтий', 'Зелений', 'Синій', 'Фіолетовий', 'Рожевий'],
    yay: 'Ура! Молодець!',
    animals: { dog: 'Собачка! Гав-гав!', cat: 'Котик! Няв!', frog: 'Жабка! Ква-ква!', cow: 'Корівка! Му-у!',
               pig: 'Свинка! Хрю-хрю!', lion: 'Лев! Р-р-р!', monkey: 'Мавпочка! У-у-а-а!', duck: 'Качечка! Кря-кря!' }
  },
  de: {
    code: 'de-DE',
    nums: ['Eins', 'Zwei', 'Drei', 'Vier', 'Fünf', 'Sechs', 'Sieben', 'Acht', 'Neun', 'Zehn'],
    colors: ['Rot', 'Orange', 'Gelb', 'Grün', 'Blau', 'Lila', 'Rosa'],
    yay: 'Hurra! Super gemacht!',
    animals: { dog: 'Hund! Wau wau!', cat: 'Katze! Miau!', frog: 'Frosch! Quak quak!', cow: 'Kuh! Muh!',
               pig: 'Schwein! Oink oink!', lion: 'Löwe! Roar!', monkey: 'Affe! U-u-a-a!', duck: 'Ente! Quak quak!' }
  }
};
const langKey = ((new URLSearchParams(location.search).get('lang')) || navigator.language || 'en').slice(0, 2).toLowerCase();
const L = LANGS[langKey] || LANGS.en;

/* ---------- speech ---------- */
let voice = null, lastSpeak = 0;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  const pre = L.code.slice(0, 2);
  voice = vs.find(v => v.lang.replace('_', '-') === L.code) || vs.find(v => v.lang.startsWith(pre)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, force) {
  if (!('speechSynthesis' in window)) return;
  const now = performance.now();
  if (!force && now - lastSpeak < 700) return;
  lastSpeak = now;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = L.code; if (voice) u.voice = voice;
    u.rate = 0.95; u.pitch = 1.3; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- audio (all synthesized, no files) ---------- */
let ac = null, master = null;
function unlockAudio() {
  if (!ac) {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.7;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
    const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
    s.buffer = b; s.connect(ac.destination); s.start(0);
  }
  if (ac.state !== 'running') ac.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.3, slideTo = null, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), gn = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
const noiseBufs = {};
function noise(dur, vol = 0.3, freq = 2000, delay = 0, type = 'bandpass') {
  if (!ac) return;
  const key = Math.round(dur * 100);
  let buf = noiseBufs[key];
  if (!buf) {
    const len = Math.max(1, Math.floor(ac.sampleRate * dur));
    buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    noiseBufs[key] = buf;
  }
  const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
  s.buffer = buf; f.type = type; f.frequency.value = freq; gn.gain.value = vol;
  s.connect(f); f.connect(gn); gn.connect(master); s.start(t);
}
const sfx = {
  pop() { noise(0.12, 0.9, rand(1200, 2000)); tone(rand(500, 700), 0.08, 'square', 0.12, 150); },
  boing() { tone(180, 0.4, 'sine', 0.45, 560); tone(360, 0.3, 'triangle', 0.1, 900, 0.03); },
  thud() { tone(140, 0.15, 'sine', 0.35, 60); noise(0.08, 0.3, 500, 0, 'lowpass'); },
  boom() {
    noise(0.7, 0.8, 350, 0, 'lowpass'); tone(110, 0.5, 'sine', 0.5, 40);
    for (let i = 0; i < 6; i++) noise(0.04, 0.25, rand(3000, 6000), 0.35 + i * rand(0.04, 0.09));
  },
  whistle() { tone(500, 0.6, 'sine', 0.06, 1400); },
  sparkle() { tone(rand(1400, 2400), 0.15, 'sine', 0.1); },
  click() { tone(660, 0.1, 'triangle', 0.3, 990); },
  tada() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.45, 'triangle', 0.3, null, i * 0.12)); },
  note(f) { tone(f, 1.0, 'triangle', 0.4); tone(f * 2, 0.5, 'sine', 0.1); tone(f * 4, 0.15, 'sine', 0.04); }
};

/* ---------- drawing helpers ---------- */
function emoji(ch, x, y, size, rot = 0, alpha = 1) {
  g.save(); g.globalAlpha = alpha; g.translate(x, y); if (rot) g.rotate(rot);
  g.font = `${Math.round(size)}px ${EF}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(ch, 0, 0); g.restore();
}
function rr(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function starPath(x, y, r, rot = 0) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr2 = i % 2 ? r * 0.45 : r, a = rot + i * Math.PI / 5 - Math.PI / 2;
    g.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
  }
  g.closePath();
}
function sky(top = '#6ec6ff', bot = '#d8f1ff') {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, top); gr.addColorStop(1, bot);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function makeClouds(n) {
  return Array.from({ length: n }, () => ({ x: rand(0, W), y: rand(0.08, 0.35), s: rand(0.6, 1.2), v: rand(8, 22) }));
}
function drawClouds(cl, dt) {
  g.fillStyle = 'rgba(255,255,255,0.92)';
  for (const c of cl) {
    const r = S * 0.05 * c.s, y = c.y * H;
    c.x += c.v * dt; if (c.x - r * 3 > W) c.x = -r * 3.5;
    g.beginPath();
    g.arc(c.x, y, r, 0, 7); g.arc(c.x + r * 1.1, y - r * 0.45, r * 1.2, 0, 7); g.arc(c.x + r * 2.2, y, r * 0.9, 0, 7);
    g.fill();
  }
}
function hills(level = 0.88, color = '#7bd35a', color2 = '#5fbf45') {
  g.fillStyle = color2; g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 20) g.lineTo(x, H * level - Math.sin(x / W * 5 + 1) * S * 0.03 - S * 0.02);
  g.lineTo(W, H); g.fill();
  g.fillStyle = color; g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 20) g.lineTo(x, H * level + Math.sin(x / W * 7) * S * 0.02);
  g.lineTo(W, H); g.fill();
}

const COLORS = ['#ff4040', '#ff9a1f', '#ffd21f', '#4cd137', '#2e86ff', '#9b59ff', '#ff66c4'];

/* ---------- particles ---------- */
let parts = [];
function addP(p) { if (parts.length < 1200) { p.max = p.life; parts.push(p); } }
function burst(x, y, colors, n, spd, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = spd * rand(0.3, 1);
    addP({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand((o.life || 1) * 0.6, o.life || 1), size: (o.size || S * 0.012) * rand(0.6, 1.3),
      color: Array.isArray(colors) ? pick(colors) : colors, g: o.g ?? S * 0.9, drag: o.drag ?? 0.98,
      type: o.type || 'confetti', rot: rand(0, 6), vr: rand(-10, 10),
      ch: o.ch ? (Array.isArray(o.ch) ? pick(o.ch) : o.ch) : null
    });
  }
}
function sparkleAt(x, y) {
  burst(x, y, ['#ffffff', '#ffe066', '#ffd6f5', '#bdf'], 10, S * 0.35, { type: 'star', g: 0, life: 0.6, size: S * 0.014, drag: 0.9 });
  sfx.sparkle();
}
function updateParts(dt) {
  for (const p of parts) {
    p.life -= dt; const d = Math.pow(p.drag, dt * 60);
    p.vx *= d; p.vy *= d; p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  parts = parts.filter(p => p.life > 0 && p.y < H + 100);
}
function drawParts(additive) {
  g.save();
  if (additive) g.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const a = Math.min(1, 2 * p.life / p.max);
    g.globalAlpha = a; g.fillStyle = p.color;
    if (p.type === 'dot') { g.beginPath(); g.arc(p.x, p.y, p.size, 0, 7); g.fill(); }
    else if (p.type === 'star') { starPath(p.x, p.y, p.size, p.rot); g.fill(); }
    else if (p.type === 'emoji') { emoji(p.ch, p.x, p.y, p.size, p.rot * 0.1, a); }
    else {
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
      g.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size); g.restore();
    }
  }
  g.restore();
}

/* ================= SCENES ================= */

/* ---------- Home ---------- */
const Home = {
  items: [
    { e: '🎈', c: '#ff5a5a', s: () => Balloons },
    { e: '🎆', c: '#7b4dff', s: () => Fireworks },
    { e: '🐶', c: '#4cc437', s: () => Peekaboo },
    { e: '🎹', c: '#2e86ff', s: () => Music },
    { e: '🛒', c: '#ff9a1f', href: '../shop/' }
  ],
  enter() { this.clouds = makeClouds(5); },
  layout() {
    const n = this.items.length, cols = W / H > 1.9 ? n : W >= H ? 3 : 2, rows = Math.ceil(n / cols);
    const cw = W / cols, ch = H / rows, r = Math.min(cw, ch) * 0.36;
    return this.items.map((it, i) => {
      const row = Math.floor(i / cols), inRow = Math.min(cols, n - row * cols);   // center a short last row
      return { it, i, x: W / 2 + cw * (i % cols - (inRow - 1) / 2), y: ch * (row + 0.5), r };
    });
  },
  frame(dt) {
    sky(); drawClouds(this.clouds, dt); hills(0.9);
    for (const t of this.layout()) {
      const bob = Math.sin(T * 3 + t.i * 1.6) * t.r * 0.05, y = t.y + bob;
      g.fillStyle = 'rgba(0,0,0,0.15)'; g.beginPath(); g.arc(t.x, y + t.r * 0.08, t.r, 0, 7); g.fill();
      g.fillStyle = t.it.c; g.beginPath(); g.arc(t.x, y, t.r, 0, 7); g.fill();
      g.lineWidth = t.r * 0.08; g.strokeStyle = '#fff'; g.stroke();
      emoji(t.it.e, t.x, y + t.r * 0.04, t.r * 1.05, Math.sin(T * 2 + t.i) * 0.1);
    }
  },
  down(x, y) {
    for (const t of this.layout()) {
      if (Math.hypot(x - t.x, y - t.y) < t.r * 1.1) {
        sfx.click();
        if (t.it.href) { location.href = t.it.href + location.search; return; }
        go(t.it.s()); burst(x, y, COLORS, 30, S * 0.6, { life: 1 });
        return;
      }
    }
    sparkleAt(x, y);
  }
};

/* ---------- Balloons: pop & count to 10 ---------- */
const Balloons = {
  enter() {
    this.list = []; this.timer = 0; this.count = 0; this.filled = []; this.big = null; this.reset = 0;
    this.clouds = makeClouds(4);
    for (let i = 0; i < 5; i++) this.spawn(rand(0.35, 1.0) * H);
  },
  spawn(y) {
    const r = S * rand(0.075, 0.1), ci = Math.floor(Math.random() * COLORS.length);
    this.list.push({ x: rand(r * 1.2, W - r * 1.2), y: y ?? H + r * 1.3, r, ci, ph: rand(0, 6), v: S * rand(0.1, 0.17) });
  },
  frame(dt) {
    sky(); drawClouds(this.clouds, dt); hills(0.9);
    this.timer -= dt;
    if (this.timer <= 0 && this.list.length < 9) { this.spawn(); this.timer = rand(0.45, 0.9); }
    for (const b of this.list) { b.y -= b.v * dt; b.ph += dt * 2; b.x += Math.sin(b.ph) * S * 0.03 * dt; }
    this.list = this.list.filter(b => b.y > -b.r * 3);
    for (const b of this.list) this.drawBalloon(b);
    if (this.reset > 0 && (this.reset -= dt) <= 0) { this.count = 0; this.filled = []; }
  },
  drawBalloon(b) {
    const { x, y, r } = b, rx = r * 0.82, c = COLORS[b.ci];
    g.strokeStyle = 'rgba(70,70,70,0.6)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, y + r);
    g.quadraticCurveTo(x + Math.sin(b.ph * 1.5) * r * 0.35, y + r * 1.8, x, y + r * 2.6); g.stroke();
    g.fillStyle = c; g.beginPath();
    g.moveTo(x, y + r - 2); g.lineTo(x - r * 0.13, y + r + r * 0.15); g.lineTo(x + r * 0.13, y + r + r * 0.15);
    g.closePath(); g.fill();
    g.beginPath(); g.ellipse(x, y, rx, r, 0, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.45)';
    g.beginPath(); g.ellipse(x - rx * 0.38, y - r * 0.4, rx * 0.2, r * 0.3, -0.5, 0, 7); g.fill();
  },
  overlay(dt) {
    const n = 10, rad = S * 0.022, gap = rad * 2.8, x0 = W / 2 - gap * (n - 1) / 2, y = SAFE_TOP + S * 0.055;
    for (let i = 0; i < n; i++) {
      const x = x0 + i * gap;
      g.beginPath(); g.arc(x, y, rad, 0, 7);
      g.fillStyle = i < this.filled.length ? COLORS[this.filled[i]] : 'rgba(255,255,255,0.6)'; g.fill();
      g.lineWidth = 3; g.strokeStyle = '#fff'; g.stroke();
    }
    if (this.big) {
      const b = this.big; b.t += dt;
      const k = Math.min(1, b.t / 0.4), s = S * 0.45 * (1 + 0.3 * Math.sin(k * Math.PI)) * k;
      emoji('🎉', W / 2, H / 2, s, Math.sin(b.t * 6) * 0.15, b.t > 1.5 ? Math.max(0, 1 - (b.t - 1.5) * 2) : 1);
      if (b.t > 2) this.big = null;
    }
  },
  down(x, y) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const b = this.list[i], pad = S * 0.035;
      const dx = (x - b.x) / (b.r * 0.82 + pad), dy = (y - b.y) / (b.r + pad);
      if (dx * dx + dy * dy <= 1) { this.pop(i); return; }
    }
    sparkleAt(x, y);
  },
  pop(i) {
    const b = this.list.splice(i, 1)[0], c = COLORS[b.ci];
    sfx.pop();
    burst(b.x, b.y, [c, c, '#fff'], 36, S * 1.1, { life: 1.1, size: S * 0.014 });
    burst(b.x, b.y, ['#fff', '#ffe066'], 8, S * 0.5, { type: 'star', g: 0, life: 0.5, size: S * 0.016 });
    if (this.count >= 10) return;
    this.filled.push(b.ci); this.count++;
    if (this.count === 10) {
      say(L.yay, true); sfx.tada(); this.big = { t: 0 }; this.reset = 2.2;
      for (let k = 0; k < 140; k++) addP({
        x: rand(0, W), y: rand(-H * 0.3, 0), vx: rand(-60, 60), vy: rand(50, 250), life: rand(2.2, 3.5),
        size: S * rand(0.01, 0.018), color: pick(COLORS), g: S * 0.25, drag: 0.99, type: 'confetti', rot: rand(0, 6), vr: rand(-8, 8)
      });
    } else {
      say(L.nums[this.count - 1], true);
    }
  }
};

/* ---------- Fireworks: tap to explode, drag to draw sparkles ---------- */
const PENTA = [262, 294, 330, 392, 440, 523, 587, 659, 784, 880, 1047];
const Fireworks = {
  additive: true,
  enter() {
    this.stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * 0.85, r: rand(0.6, 2), p: rand(0, 6) }));
    this.rockets = []; this.idle = 1.2; this.trail = {}; this.hue = 0; this.lastTink = 0; this.fresh = true;
  },
  resize() { this.fresh = true; },
  frame(dt) {
    g.fillStyle = this.fresh ? '#0a0c2a' : 'rgba(10,12,42,0.3)'; this.fresh = false;
    g.fillRect(0, 0, W, H);
    for (const s of this.stars) {
      g.globalAlpha = 0.5 + 0.5 * Math.sin(T * 2 + s.p);
      g.fillStyle = '#fff'; g.beginPath(); g.arc(s.x * W, s.y * H, s.r, 0, 7); g.fill();
    }
    g.globalAlpha = 1;
    // city silhouette
    g.fillStyle = '#05061a';
    const bw = W / 14;
    for (let i = 0; i < 14; i++) { const h = H * (0.06 + 0.08 * Math.abs(Math.sin(i * 12.9898))); g.fillRect(i * bw, H - h, bw + 1, h); }
    // auto rockets when nobody is touching
    this.idle -= dt;
    if (this.idle <= 0) {
      this.rockets.push({ x: rand(0.15, 0.85) * W, y: H, ty: rand(0.15, 0.45) * H, ci: Math.floor(Math.random() * COLORS.length) });
      sfx.whistle(); this.idle = rand(1.3, 2.6);
    }
    for (const r of this.rockets) {
      r.y -= S * 1.1 * dt;
      addP({ x: r.x + rand(-2, 2), y: r.y, vx: rand(-15, 15), vy: rand(20, 60), life: 0.5, size: S * 0.005, color: '#ffd28a', g: 0, drag: 0.95, type: 'dot', rot: 0, vr: 0 });
      if (r.y <= r.ty) { r.done = true; this.explode(r.x, r.ty, r.ci, false); }
    }
    this.rockets = this.rockets.filter(r => !r.done);
  },
  explode(x, y, ci, speak) {
    const c = COLORS[ci];
    burst(x, y, [c, c, c, '#ffffff'], 90, S * 0.75, { type: 'dot', g: S * 0.22, drag: 0.95, life: 1.6, size: S * 0.008 });
    for (let i = 0; i < 28; i++) {
      const a = i / 28 * Math.PI * 2, s = S * 0.55;
      addP({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1.3, size: S * 0.01, color: c, g: S * 0.15, drag: 0.95, type: 'star', rot: 0, vr: 5 });
    }
    sfx.boom();
    if (speak) say(L.colors[ci]);
  },
  down(x, y, id) {
    this.explode(x, y, Math.floor(Math.random() * COLORS.length), true);
    this.trail[id] = { x, y }; this.idle = 3.5;
  },
  move(x, y, id) {
    const t = this.trail[id]; if (!t) return;
    if (Math.hypot(x - t.x, y - t.y) < S * 0.012) return;
    t.x = x; t.y = y; this.idle = 3.5;
    this.hue = (this.hue + 5) % 360;
    for (let i = 0; i < 3; i++) addP({
      x, y, vx: rand(-40, 40), vy: rand(-40, 40), life: rand(0.8, 1.3), size: S * rand(0.006, 0.012),
      color: `hsl(${this.hue},100%,65%)`, g: -S * 0.05, drag: 0.96, type: i ? 'dot' : 'star', rot: rand(0, 6), vr: 4
    });
    if (T - this.lastTink > 0.08) {
      this.lastTink = T;
      const idx = Math.max(0, Math.min(PENTA.length - 1, Math.floor((1 - y / H) * PENTA.length)));
      tone(PENTA[idx], 0.35, 'sine', 0.12); tone(PENTA[idx] * 2, 0.2, 'sine', 0.03);
    }
  },
  up(id) { delete this.trail[id]; }
};

/* ---------- Peekaboo: animals pop out of holes ---------- */
const ANIMALS = [['🐶', 'dog'], ['🐱', 'cat'], ['🐸', 'frog'], ['🐮', 'cow'], ['🐷', 'pig'], ['🦁', 'lion'], ['🐵', 'monkey'], ['🦆', 'duck']];
const Peekaboo = {
  enter() { this.holes = Array.from({ length: 6 }, () => ({ a: null })); this.timer = 0.5; this.clouds = makeClouds(3); this.lastK = null; },
  layout() {
    const land = W >= H, cols = land ? 3 : 2, rows = land ? 2 : 3, top = H * 0.24;
    const cw = W / cols, ch = (H - top) / rows, hw = Math.min(cw * 0.34, ch * 0.4);
    return this.holes.map((h, i) => ({ h, x: cw * (i % cols + 0.5), y: top + ch * (Math.floor(i / cols) + 0.7), hw, sz: hw * 1.5 }));
  },
  frame(dt) {
    sky(); drawClouds(this.clouds, dt);
    g.fillStyle = '#5fbf45'; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 20) g.lineTo(x, H * 0.22 + Math.sin(x / W * 6) * S * 0.02);
    g.lineTo(W, H); g.fill();
    // spawn
    this.timer -= dt;
    const active = this.holes.filter(h => h.a && h.a.state !== 'down').length;
    if (this.timer <= 0) {
      this.timer = rand(0.6, 1.4);
      const empty = this.holes.filter(h => !h.a);
      if (active < 3 && empty.length) {
        let an; do { an = pick(ANIMALS); } while (an[1] === this.lastK);
        this.lastK = an[1];
        pick(empty).a = { e: an[0], k: an[1], p: 0, t: 0, state: 'up' };
        tone(rand(500, 700), 0.12, 'sine', 0.08, 900);
      }
    }
    for (const L2 of this.layout()) {
      const { h, x, y, hw, sz } = L2, a = h.a;
      g.fillStyle = '#4a8f33'; g.beginPath(); g.ellipse(x, y + hw * 0.08, hw * 1.25, hw * 0.42, 0, 0, 7); g.fill();
      g.fillStyle = '#3b2412'; g.beginPath(); g.ellipse(x, y, hw, hw * 0.3, 0, 0, 7); g.fill();
      if (a) {
        a.t += dt;
        if (a.state === 'up') { a.p = Math.min(1, a.p + dt * 4); if (a.t > 2.8) a.state = 'down'; }
        else if (a.state === 'hit') { a.p = 1; if (a.t > 1.2) a.state = 'down'; }
        else { a.p -= dt * 4; if (a.p <= 0) { h.a = null; } }
        if (h.a) {
          let jy = 0, rot = 0, sc = 1;
          if (a.state === 'hit' && a.t < 0.7) { const k = a.t / 0.7; jy = -Math.sin(k * Math.PI) * sz * 0.7; rot = k * Math.PI * 2; sc = 1.15; }
          g.save(); g.beginPath(); g.rect(x - hw * 2, y - sz * 4, hw * 4, sz * 4); g.clip();
          emoji(a.e, x, y + sz * 0.55 - a.p * sz * 1.0 + jy, sz * sc, rot);
          g.restore();
        }
      }
      g.strokeStyle = '#8b5a2b'; g.lineWidth = hw * 0.14; g.lineCap = 'round';
      g.beginPath(); g.ellipse(x, y, hw, hw * 0.3, 0, 0, Math.PI); g.stroke();
    }
  },
  down(x, y) {
    for (const { h, x: hx, y: hy, hw, sz } of this.layout()) {
      if (Math.abs(x - hx) < hw * 1.3 && y > hy - sz * 1.7 && y < hy + hw * 0.6) {
        const a = h.a;
        if (a && a.state === 'up' && a.p > 0.2) {
          a.state = 'hit'; a.t = 0; sfx.boing();
          burst(hx, hy - sz * 0.5, ['#ffe066', '#ff66c4', '#fff', '#6cf'], 24, S * 0.6, { type: 'star', g: S * 0.3, life: 1, size: S * 0.018 });
          burst(hx, hy - sz * 0.5, null, 5, S * 0.3, { type: 'emoji', ch: ['❤️', '⭐', '✨'], g: -S * 0.1, life: 1.2, size: S * 0.05 });
          say(L.animals[a.k], true);
          return;
        }
        if (!a) { sfx.thud(); burst(hx, hy, ['#8b5a2b', '#a0703a', '#5c3a1a'], 14, S * 0.35, { type: 'dot', g: S * 0.8, life: 0.6, size: S * 0.008 }); return; }
      }
    }
    sparkleAt(x, y);
  }
};

/* ---------- Music: big animal xylophone ---------- */
const NOTES = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25];
const PADS = [['🐘', '#ff4d4d'], ['🐻', '#ff9a1f'], ['🐥', '#ffcc00'], ['🐸', '#4cc437'], ['🐢', '#1fc7b6'], ['🐳', '#2e86ff'], ['🐙', '#8a4dff'], ['🦄', '#ff5ec4']];
const Music = {
  enter() { this.hit = new Array(8).fill(0); this.cur = {}; },
  layout() {
    const land = W >= H, cols = land ? 4 : 2, rows = land ? 2 : 4, pad = S * 0.03, top = SAFE_TOP + S * 0.12;
    const cw = (W - pad) / cols, ch = (H - top - pad) / rows;
    return PADS.map((p, i) => ({ i, x: pad + (i % cols) * cw, y: top + Math.floor(i / cols) * ch, w: cw - pad, h: ch - pad }));
  },
  frame(dt) {
    sky('#fff4c9', '#ffd7e6');
    for (let i = 0; i < 9; i++) emoji(i % 2 ? '🎵' : '🎶', (i + 0.5) * W / 9, SAFE_TOP + S * 0.06 + Math.sin(T * 2 + i) * S * 0.01, S * 0.04, 0, 0.35);
    for (const p of this.layout()) {
      const h = this.hit[p.i] = Math.max(0, this.hit[p.i] - dt * 3);
      const sc = 1 - 0.06 * h, cx = p.x + p.w / 2, cy = p.y + p.h / 2, w = p.w * sc, hh = p.h * sc, rad = Math.min(w, hh) * 0.18;
      g.fillStyle = 'rgba(0,0,0,0.15)'; rr(cx - w / 2, cy - hh / 2 + S * 0.01, w, hh, rad); g.fill();
      g.fillStyle = PADS[p.i][1]; rr(cx - w / 2, cy - hh / 2, w, hh, rad); g.fill();
      if (h > 0) { g.fillStyle = `rgba(255,255,255,${0.45 * h})`; g.fill(); }
      g.lineWidth = S * 0.008; g.strokeStyle = 'rgba(255,255,255,0.85)'; g.stroke();
      emoji(PADS[p.i][0], cx, cy - Math.sin(h * Math.PI) * hh * 0.15, Math.min(w, hh) * 0.55, (h > 0 ? Math.sin(T * 30) * 0.15 * h : 0));
    }
  },
  padAt(x, y) {
    for (const p of this.layout()) if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) return p.i;
    return -1;
  },
  play(i) {
    this.hit[i] = 1; sfx.note(NOTES[i]);
    const p = this.layout()[i];
    burst(p.x + p.w / 2, p.y + p.h * 0.3, null, 2, S * 0.25, { type: 'emoji', ch: ['🎵', '🎶'], g: -S * 0.4, life: 1.2, size: S * 0.06, drag: 0.97 });
  },
  down(x, y, id) { const i = this.padAt(x, y); this.cur[id] = i; if (i >= 0) this.play(i); else sparkleAt(x, y); },
  move(x, y, id) {
    if (!(id in this.cur)) return;
    const i = this.padAt(x, y);
    if (i !== this.cur[id]) { this.cur[id] = i; if (i >= 0) this.play(i); }
  },
  up(id) { delete this.cur[id]; }
};

/* ---------- scene switching + parent "home" button (hold to exit) ---------- */
let scene = null;
function go(s) { parts = []; scene = s; s.enter(); }

const HB = { id: null, t: 0, wig: 0, HOLD: 1.2 };
function hbPos() { const r = Math.max(26, S * 0.04); return { x: W - r - S * 0.025, y: SAFE_TOP + r + S * 0.025, r }; }
function drawHomeBtn(dt) {
  const p = hbPos();
  if (HB.id !== null) { HB.t += dt; if (HB.t >= HB.HOLD) { HB.id = null; sfx.click(); go(Home); return; } }
  HB.wig = Math.max(0, HB.wig - dt);
  g.save(); g.translate(p.x, p.y); g.rotate(Math.sin(HB.wig * 40) * 0.25 * HB.wig);
  g.globalAlpha = 0.85; g.fillStyle = '#fff'; g.beginPath(); g.arc(0, 0, p.r, 0, 7); g.fill(); g.globalAlpha = 1;
  emoji('🏠', 0, 2, p.r * 1.1);
  if (HB.id !== null) {
    g.lineWidth = p.r * 0.22; g.strokeStyle = '#ff4d4d'; g.lineCap = 'round';
    g.beginPath(); g.arc(0, 0, p.r * 1.05, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * HB.t / HB.HOLD); g.stroke();
  }
  g.restore();
}

/* ---------- input ---------- */
let extrasDone = false;
function extras() {
  if (extrasDone) return; extrasDone = true;
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
    if (ac && ac.state !== 'running') ac.resume();
  }
});

cv.addEventListener('pointerdown', e => {
  e.preventDefault(); unlockAudio(); extras();
  const x = e.clientX, y = e.clientY;
  if (scene !== Home) {
    const p = hbPos();
    if (Math.hypot(x - p.x, y - p.y) < p.r * 1.3) { HB.id = e.pointerId; HB.t = 0; HB.wig = 0.5; return; }
  }
  scene.down && scene.down(x, y, e.pointerId);
}, { passive: false });
cv.addEventListener('pointermove', e => { e.preventDefault(); scene.move && scene.move(e.clientX, e.clientY, e.pointerId); }, { passive: false });
function end(e) { if (e.pointerId === HB.id) HB.id = null; scene.up && scene.up(e.pointerId); }
cv.addEventListener('pointerup', end);
cv.addEventListener('pointercancel', end);
for (const ev of ['gesturestart', 'gesturechange', 'dblclick', 'contextmenu']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ---------- main loop ---------- */
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
go(Home);
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; T += dt;
  scene.frame(dt);
  updateParts(dt); drawParts(scene.additive);
  if (scene.overlay) scene.overlay(dt);
  if (scene !== Home) drawHomeBtn(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
