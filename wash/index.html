<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wash!">
<meta name="theme-color" content="#8fd3ff">
<title>Wash!</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; overscroll-behavior: none; }
  * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #sat { position: fixed; top: 0; left: 0; width: 1px; height: env(safe-area-inset-top, 0px); visibility: hidden; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sat"></div>
<script src="../play/kit.js"></script>
<script>
'use strict';
/* Car wash: a muddy vehicle drives in. Rub it with the sponge, rinse the foam off, wave it goodbye. */

const CARS = [
  { e: '🚗', k: 'car' }, { e: '🚌', k: 'bus' }, { e: '🚜', k: 'tractor' }, { e: '🚒', k: 'fire' },
  { e: '🚓', k: 'police' }, { e: '🚕', k: 'taxi' }, { e: '🚚', k: 'truck' }, { e: '🚑', k: 'ambulance' }
];
pickLang({
  en: {
    code: 'en-US', soap: 'So dirty! Scrub, scrub!', rinse: 'Now the water!', clean: 'All clean! Bye-bye!',
    cars: { car: 'Car', bus: 'Bus', tractor: 'Tractor', fire: 'Fire truck', police: 'Police car', taxi: 'Taxi', truck: 'Truck', ambulance: 'Ambulance' }
  },
  uk: {
    code: 'uk-UA', soap: 'Ой, брудно! Миємо, миємо!', rinse: 'А тепер водичка!', clean: 'Чистенько! Па-па!',
    cars: { car: 'Машинка', bus: 'Автобус', tractor: 'Трактор', fire: 'Пожежна машина', police: 'Поліцейська машина', taxi: 'Таксі', truck: 'Вантажівка', ambulance: 'Швидка допомога' }
  },
  de: {
    code: 'de-DE', soap: 'So schmutzig! Schrubb, schrubb!', rinse: 'Jetzt das Wasser!', clean: 'Alles sauber! Tschüss!',
    cars: { car: 'Auto', bus: 'Bus', tractor: 'Traktor', fire: 'Feuerwehr', police: 'Polizeiauto', taxi: 'Taxi', truck: 'Lastwagen', ambulance: 'Krankenwagen' }
  }
});

const VL = { w: 1024, h: 768, car: { x: 512, y: 372, s: 400 }, steps: { x: 512, y: 678, gap: 190, r: 56 } };
const VP = { w: 768, h: 1024, car: { x: 384, y: 480, s: 440 }, steps: { x: 384, y: 880, gap: 210, r: 66 } };
const roadY = () => LY.car.y + LY.car.s * 0.3;

const st = { mode: 'in', t: 0, ci: -1, mud: [], foam: [], spark: 0, snd: 0, honk: 0 };
const cr = { x: 0, y: 0, tw: null };   // the vehicle; mud and foam ride on it in units of its size

function onCar(x, y) {
  const c = LY.car;
  return Math.pow((x - cr.x) / (c.s * 0.5), 2) + Math.pow((y - c.y) / (c.s * 0.36), 2) < 1;
}
function addFoam(dx, dy) {
  if (st.foam.length >= 46) return;
  st.foam.push({ dx: dx + rand(-0.03, 0.03), dy: dy + rand(-0.03, 0.03), r: rand(15, 28), ph: rand(0, 6) });
}
function newCar() {
  st.ci = (st.ci + 1) % CARS.length;
  st.mode = 'in'; st.t = 0; st.foam = [];
  st.mud = Array.from({ length: 13 }, () => {
    const a = rand(0, Math.PI * 2), d = Math.sqrt(Math.random());
    return { dx: Math.cos(a) * d * 0.38, dy: Math.sin(a) * d * 0.2 + 0.02, r: rand(26, 44), hp: 1, rot: rand(0, 6) };
  });
  cr.x = view().x1 + LY.car.s * 0.7;
  engine();
  tween(cr, LY.car.x, 0, 1.3, 0, () => { st.mode = 'soap'; st.t = 0; idle = 0; honk(); say(L.cars[CARS[st.ci].k]); st.told = false; });
}
function engine() { tone(70, 1.2, 'sawtooth', 0.12, 110); noise(0.9, 0.12, 300, 0, 'lowpass'); }
function honk() { st.honk = 0.4; tone(440, 0.16, 'square', 0.13); tone(349, 0.16, 'square', 0.13); tone(440, 0.22, 'square', 0.13, null, 0.2); tone(349, 0.22, 'square', 0.13, null, 0.2); }

function scrub(x, y, pow) {
  const c = LY.car, s = c.s, quiet = T - st.snd < 0.09;
  if (st.mode === 'soap') {
    if (!onCar(x, y)) return;
    for (const m of st.mud) {
      if (Math.hypot(x - (cr.x + m.dx * s), y - (c.y + m.dy * s)) > m.r + 60) continue;
      m.hp -= pow;
      if (m.hp <= 0) { addFoam(m.dx, m.dy); addFoam(m.dx, m.dy); sfx.pop(); }
    }
    st.mud = st.mud.filter(m => m.hp > 0);
    if (Math.random() < 0.3) addFoam((x - cr.x) / s, (y - c.y) / s);
    if (!quiet) { st.snd = T; noise(0.08, 0.2, rand(2500, 4000)); }
    if (!st.mud.length) {
      while (st.foam.length < 14) { const a = rand(0, 6.28), d = Math.sqrt(Math.random()); addFoam(Math.cos(a) * d * 0.36, Math.sin(a) * d * 0.2); }
      st.mode = 'rinse'; st.t = 0; sfx.ding(); say(L.rinse);
    }
  } else if (st.mode === 'rinse' && st.t > 0.5) {   // a short pause, so one long rub does not skip the rinse
    for (let i = 0; i < 3; i++) addP({ x: x + rand(-30, 30), y: y - 20, vx: rand(-60, 60), vy: rand(100, 300), life: 0.6,
      size: rand(4, 8), color: pick(['#4db8ff', '#9fdcff', '#fff']), g: 900, drag: 0.99, type: 'dot', rot: 0, vr: 0 });
    if (!quiet) { st.snd = T; noise(0.12, 0.16, 1500, 0, 'highpass'); }
    const n = st.foam.length;
    st.foam = st.foam.filter(f => Math.hypot(x - (cr.x + f.dx * s), y - (c.y + f.dy * s)) > f.r + 55);
    if (st.foam.length < n) sfx.pop();
    if (!st.foam.length) {
      st.mode = 'shine'; st.t = 0;
      sfx.yay(); confettiRain(); setTimeout(() => say(L.clean), 300);
    }
  }
}

function update(dt) {
  st.t += dt; st.honk = Math.max(0, st.honk - dt);
  stepTween(cr, dt);
  if (st.mode === 'soap' && !st.told && st.t > 1.4) { st.told = true; say(L.soap); }
  if (st.mode === 'shine') {
    if ((st.spark -= dt) < 0) {
      st.spark = 0.1; const c = LY.car;
      burst(cr.x + rand(-0.42, 0.42) * c.s, c.y + rand(-0.2, 0.22) * c.s, ['#fff', '#ffe066', '#bdf'], 3, 120, { type: 'star', g: 0, life: 0.6, size: 12, drag: 0.9 });
    }
    if (st.t > 3.4) {
      st.mode = 'out'; honk(); engine();
      tween(cr, view().x0 - LY.car.s * 0.7, 0, 1.3, 0, newCar);
    }
  }
}

/* ---------- drawing ---------- */
function drawScene() {
  backdrop('#8fd3ff', '#d6f1ff');
  const v = view(), c = LY.car, ry = roadY(), half = c.s * 0.68;
  emoji('☀️', v.x0 + 80, v.y0 + 80, 90, T * 0.2);
  // the wash bay: striped posts, a roof and dripping nozzles
  const top = c.y - c.s * 0.52;
  for (const sx of [-1, 1]) {
    const px = c.x + sx * half - 20;
    g.fillStyle = '#fff'; g.fillRect(px, top, 40, ry - top);
    g.fillStyle = '#ff5a7a';
    for (let y = top; y < ry - 20; y += 60) g.fillRect(px, y + 30, 40, 30);
  }
  g.fillStyle = '#2e86ff'; rr(c.x - half - 40, top - 46, half * 2 + 80, 60, 20); g.fill();
  g.fillStyle = '#6fb0ff'; rr(c.x - half - 40, top - 46, half * 2 + 80, 18, 9); g.fill();
  for (let i = 0; i < 5; i++) {
    const nx = c.x + (i - 2) * half * 0.36;
    g.fillStyle = '#59626e'; rr(nx - 10, top + 10, 20, 22, 5); g.fill();
    if (st.mode === 'rinse') disc(nx, top + 40 + ((T * 220 + i * 37) % 60), 5, '#4db8ff');
  }
  // road
  g.fillStyle = '#6f7a86'; g.fillRect(v.x0, ry, v.x1 - v.x0, v.y1 - ry);
  g.fillStyle = '#8b96a2'; g.fillRect(v.x0, ry, v.x1 - v.x0, 10);
  g.fillStyle = 'rgba(255,255,255,0.5)';
  for (let x = Math.floor(v.x0 / 120) * 120; x < v.x1; x += 120) g.fillRect(x, ry + (v.y1 - ry) * 0.36, 70, 10);
  g.fillStyle = 'rgba(160,220,255,0.45)'; g.beginPath(); g.ellipse(c.x, ry + 34, c.s * 0.5, 18, 0, 0, 7); g.fill();
}
function drawCar() {
  const c = LY.car, s = c.s, moving = !!cr.tw;
  const bob = moving ? Math.sin(T * 30) * 2 : st.mode === 'shine' ? -Math.abs(Math.sin(T * 7)) * 10 : 0;
  const k = 1 + st.honk * 0.15;
  g.fillStyle = 'rgba(0,0,0,0.18)'; g.beginPath(); g.ellipse(cr.x, roadY() + 6, s * 0.42, 14, 0, 0, 7); g.fill();
  g.save(); g.translate(cr.x, c.y + bob); g.scale(k, k);
  emoji(CARS[st.ci].e, 0, 0, s);
  for (const m of st.mud) {
    g.save(); g.translate(m.dx * s, m.dy * s); g.rotate(m.rot); g.globalAlpha = 0.35 + 0.65 * Math.max(0, m.hp);
    disc(0, 0, m.r, '#6b4423'); disc(m.r * 0.8, m.r * 0.3, m.r * 0.45, '#6b4423'); disc(-m.r * 0.6, m.r * 0.6, m.r * 0.4, '#6b4423');
    disc(-m.r * 0.5, -m.r * 0.7, m.r * 0.35, '#6b4423'); disc(-m.r * 0.2, -m.r * 0.2, m.r * 0.3, '#85582f');
    g.restore();
  }
  for (const f of st.foam) {
    const x = f.dx * s, y = f.dy * s + Math.sin(T * 3 + f.ph) * 2;
    disc(x, y, f.r, 'rgba(255,255,255,0.92)');
    g.strokeStyle = 'rgba(120,190,240,0.6)'; g.lineWidth = 2; g.stroke();
    disc(x - f.r * 0.3, y - f.r * 0.3, f.r * 0.22, 'rgba(190,230,255,0.9)');
  }
  g.restore();
}
function drawSteps() {
  const p = LY.steps, cur = { soap: 0, rinse: 1, shine: 2, out: 2 }[st.mode] ?? -1;
  ['🧽', '🚿', '✨'].forEach((e, i) => {
    const x = p.x + (i - 1) * p.gap, on = i === cur, r = p.r * (on ? 1.12 + 0.06 * Math.sin(T * 6) : 0.9);
    disc(x, p.y + 6, r, 'rgba(0,0,0,0.2)');
    disc(x, p.y, r, on ? '#ffd21f' : i < cur ? '#7be07b' : 'rgba(255,255,255,0.75)');
    g.lineWidth = 6; g.strokeStyle = '#fff'; g.stroke();
    emoji(e, x, p.y + 3, r * 1.05, 0, i > cur ? 0.6 : 1);
    if (i < cur) emoji('✅', x + r * 0.7, p.y - r * 0.7, r * 0.6);
  });
}
function draw() {
  drawScene(); drawCar(); drawSteps();
  const tool = st.mode === 'soap' ? '🧽' : st.mode === 'rinse' ? '🚿' : null;
  if (tool) for (const P of ptrs.values()) emoji(tool, P.x, P.y - 50, 84, Math.sin(T * 14) * 0.15);
}

function hint() {
  const c = LY.car, o = st.mode === 'soap' ? st.mud[0] : st.mode === 'rinse' ? st.foam[0] : null;
  return o ? [cr.x + o.dx * c.s + Math.sin(T * 4) * 40, c.y + o.dy * c.s] : null;
}

function down(P) {
  if (st.mode === 'soap' || st.mode === 'rinse') { if (onCar(P.x, P.y) || st.mode === 'rinse') scrub(P.x, P.y, 0.5); else sparkleAt(P.x, P.y); }
  else if (onCar(P.x, P.y)) honk();
  else sparkleAt(P.x, P.y);
}
function move(P) { scrub(P.x, P.y, 0.15); }
function layout() {
  if (!cr.tw) cr.x = LY.car.x;
  else if (st.mode === 'in') { cr.tw.x1 = LY.car.x; }
}

start({ VL, VP, update, draw, down, move, hint, layout, init: newCar });
</script>
</body>
</html>
